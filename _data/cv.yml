    Projects:
      - name: Cloud Infrastructure Management with OpenStack & DevStack
        summary: Cloud Computing
        highlights:
          - >-
            Deployed OpenStack using DevStack on a Google
            Cloud virtual machine, creating a cloud
            environment within an existing IaaS infrastructure.
          - >-
            Configured tenants, networks, security policies,
            and virtual machine provisioning to simulate
            cloud provider operations.
        start_date: 2026-04-01
        end_date: 2026-06-01

      - name: LoukIt! – Android Daily Task Management Application
        summary: Android Development
        highlights:
          - >-
            Developed an Android application in Java for
            creating, organizing, tracking, and completing
            daily tasks.
          - >-
            Implemented local data persistence with Room
            (SQLite), background processing with WorkManager,
            task management through a Content Provider,
            and location-based functionality using Google Maps.
        start_date: 2025-10-01
        end_date: 2026-01-06

      - name: Pet Adoption Web-App | DevOps & CI/CD Automation
        summary: DevOps Core Concepts and Tools
        highlights:
          - >-
            Developed a role-based pet adoption web
            application using Java, Spring Boot,
            Spring Security, Thymeleaf, and MariaDB.
          - >-
            Automated deployment across Azure virtual machines
            using Ansible, Docker, and Docker Compose,
            with Jenkins CI/CD pipelines for testing,
            image builds, and deployment.
          - >-
            Integrated MinIO for object storage, MailHog
            for email testing, and Nginx as a reverse proxy.
        start_date: 2025-04-22
        end_date: 2025-07-02

      - name: Post-Quantum Cryptography in TLS | Merkle Tree Certificates & Certificate Transparency
        summary: TLS and Web PKI Research
        highlights:
          - >-
            Researched the impact of post-quantum
            cryptography on TLS certificates and
            handshake overhead.
          - >-
            Examined Merkle Tree Certificates (MTCs)
            and their relationship with Certificate
            Transparency to improve the efficiency
            and scalability of Web PKI.
        start_date: 2026-05-06
        end_date: 2026-05-20

